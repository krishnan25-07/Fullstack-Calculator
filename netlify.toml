[build]
  command = "npm --prefix 02-my-frontend ci && npm --prefix 02-my-backend ci && npm --prefix 02-my-frontend run build"
  publish = "02-my-frontend/dist"

[functions]
  directory = "02-my-backend/functions"
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true